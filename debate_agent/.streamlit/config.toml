[theme]
base = "light"
primaryColor = "#0f172a"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"

[server]
# headless 를 켜두면 Streamlit 최초 실행 시 이메일 입력 프롬프트가 뜨지 않는다.
# 브라우저는 run.ps1 이 서버 준비를 확인한 뒤 직접 연다.
headless = true
port = 8501

[browser]
gatherUsageStats = false
